<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Traveler - Book Bus Tickets</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-white shadow p-4 flex justify-between items-center">
<h1 style="font-weight:900;color:#16a34a">ECO TRAVELER</h1>
<a href="https://wa.me/2349010014030" style="background:#16a34a;color:white;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:bold">09010014030</a>
</header>
<div style="max-width:800px;margin:auto;padding:16px">
<div style="background:#16a34a;color:white;border-radius:20px;padding:24px;text-align:center;margin-top:16px">
<h2 style="font-size:28px;font-weight:900">Find & Book Bus Tickets</h2>
<p>Lagos • Accra • Abuja • Kano</p>
<div style="background:white;border-radius:12px;padding:12px;margin-top:16px;display:flex;gap:8px">
<input id="from" style="width:50%;border:1px solid #ddd;padding:12px;border-radius:8px" placeholder="From: Lagos" value="Lagos">
<input id="to" style="width:50%;border:1px solid #ddd;padding:12px;border-radius:8px" placeholder="To: Accra" value="Accra">
</div>
</div>
<div id="busList" style="margin-top:24px"></div>
</div>
<script>
const buses=[
{company:"GIGM",price:"45,000",time:"6:30 AM",seats:"12 left",rating:"4.8"},
{company:"ABC Transport",price:"18,500",time:"7:00 AM",seats:"5 left",rating:"4.6"},
{company:"Peace Mass",price:"22,000",time:"8:15 AM",seats:"20 left",rating:"4.5"},
{company:"Young Shall Grow",price:"42,000",time:"9:00 AM",seats:"8 left",rating:"4.7"}
];
function render(){
const f=document.getElementById('from').value||'Lagos';
const t=document.getElementById('to').value||'Accra';
document.getElementById('busList').innerHTML=buses.map(b=>{
const msg=`Salam! Ina son tikiti: %0ACompany: ${b.company} %0ADaga: ${f} %0AZuwa: ${t} %0AFarashi: N${b.price} %0ALokaci: ${b.time}`;
return `<div style="background:white;border-radius:16px;padding:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.05)"><div><b style="font-size:18px">${b.company}</b> <span style="background:#fef9c3;padding:2px 8px;border-radius:10px;font-size:12px">⭐ ${b.rating}</span><div style="color:gray;font-size:13px;margin-top:4px">${f} → ${t} • ${b.time} • ${b.seats}</div><div style="color:#16a34a;font-weight:900;font-size:20px;margin-top:8px">₦${b.price}</div></div><a href="https://wa.me/2349010014030?text=${msg}" target="_blank" style="background:#16a34a;color:white;padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:900">Book Now</a></div>`}).join('');
}
render();
document.getElementById('from').addEventListener('input',render);
document.getElementById('to').addEventListener('input',render);
</script>
</body>
</html>
<!-- Saka wannan a inda kake son Buy Ticket button ya bayyana -->
<button id="payButton" style="background:#00C07F; color:white; padding:15px 30px; border:none; border-radius:8px; font-size:18px; font-weight:bold; width:100%;">
  Biya ₦121,000 - Lagos to Accra
</button>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  document.getElementById('payButton').addEventListener('click', function(){
    var handler = PaystackPop.setup({
      key: 'pk_test_edd322a565c4cb2a4142c...', // Naka ne - na boye karshen
      email: 'customer@email.com', // Email din customer
      amount: 121000 * 100, // ₦121,000 = ₦120k + ₦1k naka
      currency: 'NGN',
      ref: 'ECO_' + Math.floor((Math.random() * 1000000000) + 1),
      callback: function(response){
        alert('Payment Success! Ref: ' + response.reference);
        // Nan zaka tura ticket a WhatsApp
        window.location.href = "https://wa.me/234YOURNUMBER?text=Na+biya+Lagos-Accra+Ref:"+response.reference;
      },
      onClose: function(){
        alert('Ka rufe payment');
      }
    });
    handler.openIframe();
  });
</script>
