<!DOCTYPE html>
<html>
<head>
  <title>Payment - Eco Traveler</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f0fdf4;">
  <h2>Pay N121,000 - Lagos → Accra</h2>
  <button onclick="pay()" style="background: green; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px;">
    Pay Now with Paystack
  </button>

<script>
  // @ts-nocheck
  const publicKey = 'pk_test_edd322a565c4cb2a4142c2b56c60d8a2aace8d0e';

  function pay(){
    var handler = PaystackPop.setup({
      key: publicKey,
      email: 'aisha@ecotraveler.com',
      amount: 121000 * 100,
      currency: 'NGN',
      callback: function(response){
        alert('Biya yayi nasara! ' + response.reference);
      },
      onClose: function(){
        alert('Ka rufe');
      }
    });
    handler.openIframe();
  }
</script>
</body>
</html>
